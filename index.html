<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        nav {
            margin-bottom: 30px;
        }
        nav a {
            margin-right: 15px;
            padding: 10px 15px;
            background-color: black;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            cursor: crosshair;
            display: inline-block;
        }
        nav a:hover {
            background-color: #cc0000;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Stream</h1>
        
        <nav>
            <a onclick="playVideo('dQw4w9WgXcQ')">Video 1</a>
            <a onclick="playVideo('jNQXAC9IVRw')">Video 2</a>
            <a onclick="playVideo('9bZkp7q19f0')">Video 3</a>
        </nav>

        <div id="videoContainer" class="video-container">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>
        
        <h2 id="videoTitle">Video Title</h2>
    </div>

    <script>
        function playVideo(videoId) {
            const iframe = document.getElementById('videoPlayer');
            iframe.src = `https://www.youtube.com/embed/${videoId}`;
        }
    </script>
</body>
</html>
